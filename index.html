  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      overflow-x: clip;
    }

    body {
      background-color: #0b0c10;
      color: #e3e1e9;
      font-family: 'Space Grotesk', sans-serif;
    }

    ::selection {
      background: #c3f400;
      color: #08090c;
    }

    /* Grid Dots Background */
    .bg-grid-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
    }

    /* Ambient Crimson Atmosphere sampled from user monitor */
    .crimson-glow {
      background: radial-gradient(ellipse 70% 55% at 50% 46%, rgba(239, 73, 64, 0.28) 0%, rgba(189, 56, 63, 0.12) 45%, rgba(66, 15, 28, 0.04) 70%, transparent 85%);
    }

    /* PORTFOLIO Backdrop Gradient Text from user reference */
    .portfolio-bg-gradient {
      font-family: 'Anton', sans-serif;
      background: linear-gradient(180deg, #ef4940 0%, #e14441 26%, #bd383f 52%, #7b2334 78%, #3a0a14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 15px 45px rgba(239, 73, 64, 0.35));
    }

    /* Cutout Sticker Drop Shadow */
    .sticker-shadow {
      filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 25px rgba(239, 73, 64, 0.2));
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #090a0e;
    }
    ::-webkit-scrollbar-thumb {
      background: #232534;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ef4940;
    }

    /* Squiggly Underline SVG */
    .wavy-underline-wrapper {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }
    .wavy-svg-line {
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 14px;
      overflow: visible;
    }
    .wavy-svg-line path {
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      transition: stroke-dashoffset 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .wavy-svg-line.is-drawn path {
      stroke-dashoffset: 0;
    }

    /* Lenis Smooth Scroll Optimization */
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }
    .lenis.lenis-stopped {
      overflow: hidden;
    }

    /* Precision Damped Cursor Follower */
    @media (pointer: fine) {
      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 6px;
        height: 6px;
        background-color: #ef4940;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: opacity 0.2s;
      }
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        border: 1.5px solid rgba(195, 244, 0, 0.55);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: width 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                    height 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                    border-color 0.2s, background-color 0.2s;
      }
      body.cursor-active .cursor-ring {
        width: 50px;
        height: 50px;
        border-color: #ef4940;
        background-color: rgba(239, 73, 64, 0.08);
      }
    }

    /* 3D Perspective Tilt with 120 FPS Hardware Acceleration */
    .tilt-card {
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
      will-change: transform;
    }

    /* Shape-Masked Aperture Viewport (Cross-Browser WebKit & Standard) */
    .shape-mask-viewport {
      will-change: clip-path, -webkit-clip-path, transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      -webkit-clip-path: inset(18% 14% 18% 14% round 48px);
      clip-path: inset(18% 14% 18% 14% round 48px);
    }

    /* Milestone Active Highlight Classes (Preserves hover specificity) */
    .milestone-card.is-active-lime {
      border-color: rgba(195, 244, 0, 0.65);
      box-shadow: 0 0 25px rgba(195, 244, 0, 0.14);
    }
    .milestone-card.is-active-red {
      border-color: rgba(239, 73, 64, 0.65);
      box-shadow: 0 0 25px rgba(239, 73, 64, 0.14);
    }

    /* Navbar Active Section Sync & Header Scroll Elevation */
    header {
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    header.is-scrolled {
      background-color: rgba(8, 9, 13, 0.94);
      border-bottom-color: rgba(44, 48, 76, 0.85);
    }
    header nav a.is-nav-active {
      color: #c3f400;
    }

    /* Hardware Compositing Layers */
    #hero-portrait, #hero-bg-text, .project-terminal, .bento-card, .academics-card {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Material Symbols setup */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    .text-glow-red {
      text-shadow: 0 0 24px rgba(239, 73, 64, 0.65), 0 0 50px rgba(239, 73, 64, 0.35);
    }
  </style>

  <!-- ========================================== -->
  <!-- SCRIPT: INTERACTION & ANIMATION ENGINES -->
  <!-- ========================================== -->
  <script>
    // ========================================================
    // 0. PROFILE HYDRATION ENGINE (SYNCHRONOUS BEFORE MOTION INIT)
    // ========================================================
    function profileVal(node) {
      return node && typeof node === 'object' && 'value' in node ? node.value : node;
    }

    function isBlank(val) {
      const unwrapped = profileVal(val);
      if (unwrapped === null || unwrapped === undefined) return true;
      const s = String(unwrapped).trim();
      return s === '' || s.toUpperCase() === 'TBD';
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    (function renderProfile(P) {
      if (!P) return;
      const v = profileVal;
      const esc = escapeHtml;
      const setText = (id, node) => {
        const el = document.getElementById(id);
        if (!el) return;
        const val = v(node);
        if (isBlank(val)) {
          const parent = el.parentElement;
          el.remove();
          if (parent && parent.dataset.hideIfEmpty === 'true' && parent.children.length === 0) {
            parent.remove();
          }
          return;
        }
        el.textContent = String(val);
      };
      const renderHudRow = (slots, className) => {
        const active = slots.filter((s) => s && !isBlank(s.check));
        if (!active.length) return '';
        let justifyCls = 'justify-between';
        if (active.length === 1) {
          if (active[0].align === 'center') justifyCls = 'justify-center';
          else if (active[0].align === 'right') justifyCls = 'justify-end';
        }
        return `<div class="flex ${justifyCls} items-center ${className}">${active.map((s) => s.html).join('')}</div>`;
      };

      // 1. Navbar
      const navBrand = document.getElementById('nav-brand');
      if (navBrand) {
        navBrand.innerHTML = esc(v(P.identity.nameUpper)) + '<span class="text-[#ef4940]">.</span>';
      }
      const navLinks = document.getElementById('nav-links');
      if (navLinks) {
        navLinks.innerHTML =
          P.navigation.links
            .map(
              (link) =>
                `<a href="${esc(link.href)}" class="text-xs font-mono uppercase tracking-widest text-[#cbd5e1] hover:text-[#c3f400] transition-colors font-medium">${esc(v(link.label))}</a>`
            )
            .join('') +
          `<button onclick="toggleCommandPalette()" class="magnetic-btn inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-[#16182a] hover:bg-[#20233c] border border-[#2c304c] text-[11px] font-mono text-[#cbd5e1] hover:text-white transition-colors shadow-sm" title="Quick Navigation (Cmd+K / Ctrl+K)"><span>${esc(v(P.navigation.paletteKeyLabel))}</span></button>`;
      }
      const email = v(P.contact.email);
      const navCta = document.getElementById('nav-cta');
      if (navCta) {
        navCta.href = 'mailto:' + email;
        navCta.textContent = v(P.navigation.ctaLabel);
      }

      // 2. Hero
      setText('hero-location', P.identity.location);
      setText('hero-edu-short', P.identity.educationShort);
      setText('hero-availability', P.identity.availability);
      const githubSocial = P.socials.find((s) => s.id === 'github');
      const heroGithub = document.getElementById('hero-github-link');
      if (heroGithub && githubSocial) {
        heroGithub.href = v(githubSocial.href);
        heroGithub.textContent = v(githubSocial.display) + ' ↗';
      }
      setText('hero-backdrop-text', P.hero.backdropText);
      const portraitImg = document.getElementById('hero-portrait-img');
      if (portraitImg) {
        portraitImg.src = v(P.identity.portrait.src);
        portraitImg.alt = v(P.identity.portrait.alt);
      }
      setText('hero-greeting', P.hero.greeting);
      const heroName = document.getElementById('hero-name');
      if (heroName) {
        heroName.innerHTML = esc(v(P.identity.nameUpper)) + '<span class="text-[#ef4940]">.</span>';
      }
      setText('hero-tagline', P.identity.tagline);
      setText('hero-bio-badge', P.hero.bioBadge);
      setText('hero-bio-text', P.identity.bio);
      setText('hero-cursor-handle', P.identity.shortHandle);
      setText('hero-primary-cta-label', P.hero.primaryCtaLabel);
      const heroSecondaryCta = document.getElementById('hero-secondary-cta');
      if (heroSecondaryCta) heroSecondaryCta.href = 'mailto:' + email;
      setText('hero-secondary-cta-label', P.hero.secondaryCtaLabel);

      // 3. Approach / Philosophy
      setText('philosophy-eyebrow', P.approach.eyebrow);
      setText('philosophy-headline-prefix', P.approach.headlinePrefix);
      setText('philosophy-headline-highlight', P.approach.headlineHighlight);
      setText('philosophy-summary', P.approach.summary);
      const philCards = document.getElementById('philosophy-cards');
      if (philCards) {
        philCards.innerHTML = P.approach.cards
          .map((card) => {
            const hoverCls =
              card.accent === 'lime'
                ? 'hover:border-[#c3f400]/70 hover:shadow-[0_0_30px_rgba(195,244,0,0.15)]'
                : 'hover:border-[#ef4940]/70 hover:shadow-[0_0_30px_rgba(239,73,64,0.15)]';
            return `<div class="tilt-card bento-card group relative p-7 sm:p-8 rounded-2xl bg-gradient-to-b from-[#141624] to-[#0c0d15] border border-[#25283c] ${hoverCls} transition-[border-color,box-shadow] duration-300 flex flex-col justify-between shadow-2xl">
              <div>
                <div class="font-mono text-xs text-[#ef4940] font-bold tracking-wider mb-3">${esc(v(card.eyebrow))}</div>
                <h3 class="font-sans text-xl sm:text-[22px] text-white font-bold mb-3">${esc(v(card.title))}</h3>
                <p class="font-sans text-[#cbd5e1] text-sm leading-relaxed mb-6 font-normal">${esc(v(card.description))}</p>
              </div>
              <div class="pt-4 border-t border-[#232638] flex items-center justify-between font-mono text-[11px] text-[#c3f400] tracking-wider font-semibold">
                <span>${esc(v(card.footerTags))}</span>
                <span class="material-symbols-outlined text-[16px]">${esc(card.icon)}</span>
              </div>
            </div>`;
          })
          .join('');
      }

      // 4. Design Lab
      setText('design-eyebrow', P.designLab.eyebrow);
      setText('design-heading-prefix', P.designLab.headingPrefix);
      setText('design-heading-highlight', P.designLab.headingHighlight);
      setText('design-subtitle', P.designLab.subtitle);

      const mc = P.designLab.monogramCard;
      setText('design-monogram-left', mc.headerLeft);
      setText('design-monogram-right', mc.headerRight);
      setText('monogram-apex-label', mc.apexLabel);
      setText('monogram-radius-label', mc.radiusLabel);
      setText('monogram-kerning-label', mc.kerningLabel);
      setText('design-monogram-title', mc.title);
      setText('design-monogram-desc', mc.description);
      setText('design-monogram-footer-left', mc.footerLeft);
      setText('design-monogram-footer-right', mc.footerRight);

      const cc = P.designLab.colorCard;
      setText('design-color-left', cc.headerLeft);
      setText('design-color-right', cc.headerRight);
      setText('design-color-title', cc.title);
      setText('design-color-desc', cc.description);
      const swatchesEl = document.getElementById('design-swatches');
      if (swatchesEl) {
        const swatchStyles = {
          crimson: {
            hoverBorder: 'hover:border-[#ef4940]/70',
            dot: 'bg-[#ef4940] shadow-[0_0_12px_rgba(239,73,64,0.6)]',
            titleHover: 'group-hover/swatch:text-[#ef4940]',
            hexText: 'text-[#ef4940]',
          },
          lime: {
            hoverBorder: 'hover:border-[#c3f400]/70',
            dot: 'bg-[#c3f400] shadow-[0_0_12px_rgba(195,244,0,0.6)]',
            titleHover: 'group-hover/swatch:text-[#c3f400]',
            hexText: 'text-[#c3f400]',
          },
          dark: {
            hoverBorder: 'hover:border-white/50',
            dot: 'bg-[#0b0c10] border border-[#3b3f5c]',
            titleHover: '',
            hexText: 'text-[#e2e8f0]',
          },
          bezel: {
            hoverBorder: 'hover:border-white/50',
            dot: 'bg-[#151622] border border-[#3b3f5c]',
            titleHover: '',
            hexText: 'text-[#e2e8f0]',
          },
        };
        swatchesEl.innerHTML = '';
        cc.swatches.forEach((sw) => {
          const st = swatchStyles[sw.variant] || swatchStyles.dark;
          const btn = document.createElement('button');
          btn.className = `w-full flex items-center justify-between p-2.5 rounded-xl bg-[#121422] hover:bg-[#1a1c2e] border border-[#272b40] ${st.hoverBorder} transition-colors duration-150 group/swatch text-left active:scale-[0.98] shadow-sm`;
          btn.addEventListener('click', () => copyHex(v(sw.hex), v(sw.name)));
          btn.innerHTML = `<div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-lg ${st.dot} shrink-0"></span>
              <div>
                <div class="font-mono text-xs text-white font-semibold ${st.titleHover} transition-colors">${esc(v(sw.name))}</div>
                <div class="font-mono text-[10px] text-[#94a3b8]">${esc(v(sw.role))}</div>
              </div>
            </div>
            <span class="font-mono text-xs ${st.hexText} font-bold">${esc(v(sw.hex))}</span>`;
          swatchesEl.appendChild(btn);
        });
      }
      setText('design-color-footer-left', cc.footerLeft);
      setText('design-color-footer-right', cc.footerRight);

      const tc = P.designLab.typographyCard;
      setText('design-type-left', tc.headerLeft);
      setText('design-type-right', tc.headerRight);
      const specimensEl = document.getElementById('design-specimens');
      if (specimensEl) {
        const specimenStyles = {
          anton: {
            labelClass: 'text-[#ef4940]',
            sampleClass: "font-['Anton'] text-3xl sm:text-4xl text-white tracking-wide uppercase leading-tight",
          },
          grotesk: {
            labelClass: 'text-[#c3f400]',
            sampleClass: 'font-sans text-xl sm:text-2xl text-white font-extrabold tracking-tight',
          },
          mono: {
            labelClass: 'text-[#94a3b8]',
            sampleClass: 'font-mono text-xs sm:text-sm text-[#f1f5f9] font-medium',
          },
        };
        specimensEl.innerHTML = tc.specimens
          .filter((sp) => !isBlank(sp.sampleText))
          .map((sp) => {
            const st = specimenStyles[sp.styleVariant] || specimenStyles.mono;
            const headerRow = renderHudRow(
              [
                { check: sp.fontLabel, align: 'left', html: `<span>${esc(v(sp.fontLabel))}</span>` },
                { check: sp.weightLabel, align: 'right', html: `<span>${esc(v(sp.weightLabel))}</span>` },
              ],
              `mb-1 font-mono text-[10px] ${st.labelClass} font-bold`
            );
            return `<div class="p-3.5 rounded-xl bg-[#0c0d15] border border-[#222538]">
              ${headerRow}
              <div class="${st.sampleClass}">${esc(v(sp.sampleText))}</div>
            </div>`;
          })
          .join('');
      }
      setText('design-type-footer-left', tc.footerLeft);
      setText('design-type-footer-right', tc.footerRight);

      const moc = P.designLab.motionCard;
      setText('design-motion-left', moc.headerLeft);
      setText('design-motion-right', moc.headerRight);
      const filmImg = document.getElementById('design-film-img');
      if (filmImg) {
        filmImg.src = v(moc.filmViewport.image.src);
        filmImg.alt = v(moc.filmViewport.alt);
      }
      const filmBadgeEl = document.getElementById('design-film-badge');
      if (filmBadgeEl) {
        const filmBadgeVal = v(moc.filmViewport.badge);
        if (isBlank(filmBadgeVal)) {
          filmBadgeEl.remove();
        } else {
          filmBadgeEl.textContent = filmBadgeVal;
          filmBadgeEl.classList.remove('hidden');
        }
      }
      const scopeImg = document.getElementById('design-scope-img');
      if (scopeImg) {
        scopeImg.src = v(moc.scopeViewport.image.src);
        scopeImg.alt = v(moc.scopeViewport.alt);
      }
      setText('design-scope-badge', moc.scopeViewport.badge);
      setText('design-lens-label', moc.lensLabel);
      const aspectBtnsEl = document.getElementById('design-aspect-buttons');
      if (aspectBtnsEl) {
        const aspectClasses = {
          cinema: 'bg-[#181a2c] text-white hover:text-[#ef4940] border border-[#2b304c] font-bold',
          imax: 'hover:bg-[#181a2c] text-[#cbd5e1] hover:text-white border border-[#222538] font-medium',
          stadium: 'hover:bg-[#181a2c] text-[#cbd5e1] hover:text-[#c3f400] border border-[#222538] font-medium',
          full: 'hover:bg-[#181a2c] text-[#cbd5e1] hover:text-white border border-[#222538] font-medium',
        };
        aspectBtnsEl.innerHTML = '';
        moc.aspectOptions.forEach((opt) => {
          const btn = document.createElement('button');
          btn.className = `aspect-btn magnetic-btn px-2.5 py-0.5 rounded ${aspectClasses[opt.id] || aspectClasses.full} transition-colors active:scale-95 text-[10px]`;
          btn.dataset.aspect = opt.id;
          btn.textContent = v(opt.label);
          btn.addEventListener('click', () => setAspectMask(opt.id));
          aspectBtnsEl.appendChild(btn);
        });
      }
      setText('design-motion-title', moc.title);
      setText('design-motion-desc', moc.description);
      setText('design-motion-footer-left', moc.footerLeft);
      setText('design-motion-footer-right', moc.footerRight);

      // 5. Education
      setText('academics-eyebrow', P.education.eyebrow);
      setText('academics-heading-prefix', P.education.headingPrefix);
      setText('academics-intro', P.education.intro);
      setText('academics-degree', P.education.degree);
      setText('academics-years', P.education.years);
      setText('academics-institution', P.education.institution);
      const cgpaEl = document.getElementById('academics-cgpa');
      if (cgpaEl) {
        if (isBlank(P.education.cgpa)) {
          cgpaEl.remove();
        } else {
          cgpaEl.textContent = 'CGPA ' + v(P.education.cgpa);
        }
      }
      setText('academics-summary', P.education.summary);
      setText('academics-coursework-label', P.education.courseworkLabel);
      const courseworkEl = document.getElementById('academics-coursework-list');
      if (courseworkEl) {
        courseworkEl.innerHTML = P.education.coursework
          .map(
            (cw) =>
              `<span class="font-mono text-xs px-3 py-1 rounded-full bg-[#16182a] border border-[#2c304c] text-[#f1f5f9] hover:border-[#c3f400]/70 hover:text-[#c3f400] transition-colors font-medium">${esc(v(cw))}</span>`
          )
          .join('');
      }

      // 6. Selected Projects
      setText('work-eyebrow', P.projects.eyebrow);
      setText('work-heading-prefix', P.projects.headingPrefix);
      setText('work-heading-highlight', P.projects.headingHighlight);
      setText('work-subtitle', P.projects.subtitle);

      const featuredEl = document.getElementById('work-featured-list');
      if (featuredEl) {
        featuredEl.innerHTML = P.projects.featured
          .map((proj) => {
            const isLime = proj.accent === 'lime';
            const cardHover = isLime
              ? 'hover:border-[#c3f400]/60 hover:shadow-[0_0_35px_rgba(195,244,0,0.12)]'
              : 'hover:border-[#ef4940]/60 hover:shadow-[0_0_35px_rgba(239,73,64,0.15)]';
            const statusColor = isLime ? 'text-[#c3f400]' : 'text-[#ef4940]';
            const firstTagStyle = isLime
              ? 'text-[#c3f400] border-[#2c304c] font-bold'
              : 'text-[#ef4940] border-[#3d1d23] font-bold';
            const tagsHtml = proj.techTags
              .filter((tag) => !isBlank(tag))
              .map((tag, i) => {
                const cls = i === 0 ? firstTagStyle : 'text-[#f1f5f9] border-[#2c304c] font-medium';
                return `<span class="px-3 py-1 rounded-full bg-[#181a2e] text-mono text-xs border ${cls}">${esc(v(tag))}</span>`;
              })
              .join('');
            const badgeHtml = !isBlank(proj.competitionBadge)
              ? `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#18121a] border border-[#ef4940]/50 text-xs font-mono text-[#ef4940] font-bold shadow-sm">
                  <span class="material-symbols-outlined text-[14px]">military_tech</span>
                  <span>${esc(v(proj.competitionBadge))}</span>
                </div>`
              : '';
            const metricsHtml = (proj.metrics || [])
              .filter((m) => !isBlank(m.value) && !isBlank(m.label))
              .map((m) => {
                const valColor = m.highlight ? (isLime ? 'text-[#c3f400]' : 'text-[#ef4940]') : 'text-white';
                return `<div>
                  <div class="font-sans font-black text-2xl sm:text-3xl ${valColor}">${esc(v(m.value))}</div>
                  <div class="font-mono text-[11px] text-[#94a3b8] uppercase tracking-wider font-semibold">${esc(v(m.label))}</div>
                </div>`;
              })
              .join('');
            const metricsBlock = metricsHtml
              ? `<div class="pt-4 flex flex-wrap items-center gap-x-6 gap-y-3 sm:gap-8 border-t border-[#222538]">${metricsHtml}</div>`
              : '';

            const githubUrl = proj.links && v(proj.links.github);
            const demoUrl = proj.links && v(proj.links.demo);
            const linksHtml =
              !isBlank(githubUrl) || !isBlank(demoUrl)
                ? `<div class="pt-3 flex flex-wrap items-center gap-4 text-xs font-mono">
                    ${!isBlank(githubUrl) ? `<a href="${esc(githubUrl)}" target="_blank" rel="noopener noreferrer" class="text-[#cbd5e1] hover:text-[#c3f400] transition-colors">GITHUB ↗</a>` : ''}
                    ${!isBlank(demoUrl) ? `<a href="${esc(demoUrl)}" target="_blank" rel="noopener noreferrer" class="text-[#cbd5e1] hover:text-[#ef4940] transition-colors">LIVE DEMO ↗</a>` : ''}
                  </div>`
                : '';

            let viewportHtml = '';
            const vp = proj.viewport;
            if (vp.type === 'radar') {
              const radarRightHtml =
                !isBlank(vp.topRightPrimary) || !isBlank(vp.topRightSecondary)
                  ? `<div class="text-right">
                      ${!isBlank(vp.topRightPrimary) ? `<div class="text-[#c3f400] font-bold">${esc(v(vp.topRightPrimary))}</div>` : ''}
                      ${!isBlank(vp.topRightSecondary) ? `<div>${esc(v(vp.topRightSecondary))}</div>` : ''}
                    </div>`
                  : '';
              const radarTopRow = renderHudRow(
                [
                  { check: vp.topLeft, align: 'left', html: `<span class="text-[#cbd5e1]">${esc(v(vp.topLeft))}</span>` },
                  {
                    check: !isBlank(vp.topRightPrimary) ? vp.topRightPrimary : vp.topRightSecondary,
                    align: 'right',
                    html: radarRightHtml,
                  },
                ],
                'font-mono text-[10px] text-[#94a3b8] font-medium'
              );
              const radarBottomRow = renderHudRow(
                [
                  { check: vp.bottomLeft, align: 'left', html: `<span class="text-[#c3f400] font-bold">${esc(v(vp.bottomLeft))}</span>` },
                  { check: vp.bottomRight, align: 'right', html: `<span class="text-[#cbd5e1]">${esc(v(vp.bottomRight))}</span>` },
                ],
                'font-mono text-[10px] text-[#94a3b8] font-medium'
              );
              viewportHtml = `<div class="lg:col-span-6 relative h-64 sm:h-72 rounded-xl bg-[#06070c] border border-[#202336] overflow-hidden flex flex-col justify-between p-4 shadow-inner">
                ${radarTopRow}
                <div class="relative w-full flex-1 flex items-center justify-center my-auto">
                  <canvas id="${esc(vp.canvasId)}" width="280" height="150" class="max-w-full"></canvas>
                </div>
                ${radarBottomRow}
              </div>`;
            } else if (vp.type === 'waveform') {
              const waveTopRow = renderHudRow(
                [
                  { check: vp.topLeft, align: 'left', html: `<span class="text-[#cbd5e1]">${esc(v(vp.topLeft))}</span>` },
                  { check: vp.topCenter, align: 'center', html: `<span class="text-[#c3f400] font-bold">${esc(v(vp.topCenter))}</span>` },
                  { check: vp.topRight, align: 'right', html: `<span class="text-white">${esc(v(vp.topRight))}</span>` },
                ],
                'font-mono text-[10px] text-[#94a3b8] font-medium'
              );
              const waveBottomRow = renderHudRow(
                [
                  { check: vp.rttValue, align: 'left', html: `<span class="text-[#cbd5e1]">RTT: ${esc(v(vp.rttValue))}</span>` },
                  { check: vp.bottomCenter, align: 'center', html: `<span class="text-[#ef4940] font-bold">${esc(v(vp.bottomCenter))}</span>` },
                  { check: vp.lossValue, align: 'right', html: `<span class="text-[#c3f400]">LOSS: ${esc(v(vp.lossValue))}</span>` },
                ],
                'font-mono text-[10px] text-[#94a3b8] font-medium'
              );
              viewportHtml = `<div class="lg:col-span-6 relative h-64 sm:h-72 rounded-xl bg-[#06070c] border border-[#202336] overflow-hidden flex flex-col justify-between p-4 shadow-inner">
                ${waveTopRow}
                <div class="relative w-full flex-1 flex items-center justify-center my-auto">
                  <canvas id="${esc(vp.canvasId)}" width="400" height="130" class="w-full h-full"></canvas>
                </div>
                ${waveBottomRow}
              </div>`;
            } else if (vp.type === 'scrubber') {
              const hasImgs = Array.isArray(proj.images) && proj.images.length >= 2;
              const imgsBlock = hasImgs
                ? `<div class="grid grid-cols-2 gap-3 h-36 sm:h-40">
                  <div class="relative rounded-lg overflow-hidden border border-[#25283c] bg-black">
                    <img src="${esc(v(proj.images[0].src))}" alt="${esc(v(proj.images[0].alt))}" class="w-full h-full object-cover">
                    ${!isBlank(proj.images[0].badge) ? `<div class="absolute bottom-1.5 left-2 font-mono text-[9px] text-white bg-black/80 px-2 py-0.5 rounded border border-white/10 font-bold">${esc(v(proj.images[0].badge))}</div>` : ''}
                  </div>
                  <div class="relative rounded-lg overflow-hidden border border-[#25283c] bg-[#07080c]">
                    <img src="${esc(v(proj.images[1].src))}" alt="${esc(v(proj.images[1].alt))}" class="w-full h-full object-cover">
                    ${!isBlank(proj.images[1].badge) ? `<div class="absolute top-1.5 right-2 font-mono text-[9px] text-[#ef4940] bg-black/80 px-2 py-0.5 rounded border border-white/10 font-bold">${esc(v(proj.images[1].badge))}</div>` : ''}
                  </div>
                </div>`
                : '';
              const scrubberTopRow = renderHudRow(
                [
                  { check: vp.pairCount, align: 'left', html: `<span id="timecode-display">BATCH: 0048 // ${esc(v(vp.pairCount))}</span>` },
                  { check: vp.statusLabel, align: 'center', html: `<span class="text-[#ef4940] font-bold">${esc(v(vp.statusLabel))}</span>` },
                  { check: vp.accuracyValue, align: 'right', html: `<span class="text-[#c3f400] font-bold">ACC: ${esc(v(vp.accuracyValue))}</span>` },
                ],
                'font-mono text-[10px] text-[#cbd5e1] mb-1 font-medium'
              );
              viewportHtml = `<div class="lg:col-span-6 relative rounded-xl bg-[#06070c] border border-[#202336] overflow-hidden flex flex-col justify-between p-4 space-y-3 shadow-inner">
                ${imgsBlock}
                <div class="${hasImgs ? 'pt-2' : 'py-2'}">
                  ${scrubberTopRow}
                  <div class="relative w-full h-2.5 bg-[#181a28] rounded-full overflow-hidden cursor-pointer" id="scrubber-bar">
                    <div class="absolute top-0 left-0 h-full bg-[#ef4940] rounded-full w-[45%]" id="scrubber-progress"></div>
                  </div>
                </div>
              </div>`;
            }

            const galleryHtml =
              vp.type !== 'scrubber' && Array.isArray(proj.images) && proj.images.length
                ? `<div class="px-6 sm:px-8 lg:px-10 pb-6 sm:pb-8 pt-4 border-t border-[#222538]/80">
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                      ${proj.images
                        .map(
                          (img) => `<div class="relative h-32 sm:h-36 rounded-lg overflow-hidden border border-[#25283c] bg-[#06070c]">
                            <img src="${esc(v(img.src))}" alt="${esc(v(img.alt))}" class="w-full h-full object-contain p-1">
                            ${!isBlank(img.badge) ? `<div class="absolute bottom-1.5 left-2 font-mono text-[9px] text-white bg-black/80 px-2 py-0.5 rounded border border-white/10 font-bold">${esc(v(img.badge))}</div>` : ''}
                          </div>`
                        )
                        .join('')}
                    </div>
                  </div>`
                : '';

            return `<div class="tilt-card project-card project-terminal group rounded-2xl bg-gradient-to-b from-[#121422] to-[#0a0b12] border border-[#25283c] overflow-hidden shadow-2xl transition-[border-color,box-shadow] duration-300 ${cardHover}">
              <div class="flex items-center justify-between gap-2 px-4 sm:px-5 py-3.5 bg-[#151726] border-b border-[#24273c]">
                <div class="flex items-center gap-2 shrink-0">
                  <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block shadow-sm"></span>
                  <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block shadow-sm"></span>
                  <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block shadow-sm"></span>
                </div>
                ${!isBlank(proj.filename) ? `<div class="font-mono text-xs text-white font-semibold truncate min-w-0 px-2">${esc(v(proj.filename))}</div>` : ''}
                ${!isBlank(proj.statusLabel) ? `<div class="font-mono text-[11px] ${statusColor} font-bold whitespace-nowrap shrink-0">${esc(v(proj.statusLabel))}</div>` : ''}
              </div>
              <div class="p-6 sm:p-8 lg:p-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <div class="lg:col-span-6 space-y-4">
                  <div class="flex flex-wrap items-center gap-2">${tagsHtml}</div>
                  ${badgeHtml}
                  <h3 class="font-sans text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">${esc(v(proj.title))}</h3>
                  <p class="font-sans text-[#cbd5e1] text-sm sm:text-base leading-relaxed">${esc(v(proj.description))}</p>
                  ${metricsBlock}
                  ${linksHtml}
                </div>
                ${viewportHtml}
              </div>
              ${galleryHtml}
            </div>`;
          })
          .join('');
      }

      const bentoEl = document.getElementById('work-bento-grid');
      if (bentoEl) {
        bentoEl.innerHTML = P.projects.bento
          .map((proj) => {
            const isLime = proj.accent === 'lime';
            const hoverBorder = isLime ? 'hover:border-[#c3f400]/60' : 'hover:border-[#ef4940]/60';
            const accentText = isLime ? 'text-[#c3f400]' : 'text-[#ef4940]';
            const tagsHtml = proj.techTags
              .filter((t) => !isBlank(t))
              .map(
                (t) =>
                  `<span class="font-mono text-[10px] px-2.5 py-0.5 rounded-full bg-[#181a2e] border border-[#2c304c] text-[#f1f5f9] font-medium">${esc(v(t))}</span>`
              )
              .join('');
            const githubUrl = proj.links && v(proj.links.github);
            const demoUrl = proj.links && v(proj.links.demo);
            const linksHtml =
              !isBlank(githubUrl) || !isBlank(demoUrl)
                ? `<div class="pb-3 flex items-center gap-4 text-[11px] font-mono">
                    ${!isBlank(githubUrl) ? `<a href="${esc(githubUrl)}" target="_blank" rel="noopener noreferrer" class="text-[#cbd5e1] hover:text-[#c3f400] transition-colors">GITHUB ↗</a>` : ''}
                    ${!isBlank(demoUrl) ? `<a href="${esc(demoUrl)}" target="_blank" rel="noopener noreferrer" class="text-[#cbd5e1] hover:text-[#ef4940] transition-colors">LIVE DEMO ↗</a>` : ''}
                  </div>`
                : '';
            const bentoTopRow = renderHudRow(
              [
                { check: proj.category, align: 'left', html: `<span class="font-mono text-xs ${accentText} font-bold">${esc(v(proj.category))}</span>` },
                { check: proj.stackHighlight, align: 'right', html: `<span class="font-mono text-xs text-[#94a3b8] font-medium">${esc(v(proj.stackHighlight))}</span>` },
              ],
              'mb-3'
            );
            const bentoFooterRow = renderHudRow(
              [
                { check: proj.footerLeft, align: 'left', html: `<span>${esc(v(proj.footerLeft))}</span>` },
                { check: proj.footerRight, align: 'right', html: `<span>${esc(v(proj.footerRight))}</span>` },
              ],
              `pt-3 border-t border-[#232638] text-xs font-mono ${accentText} font-semibold`
            );
            return `<div class="tilt-card project-card p-6 sm:p-7 rounded-2xl bg-gradient-to-b from-[#141624] to-[#0c0d15] border border-[#25283c] ${hoverBorder} transition-[border-color,box-shadow] duration-300 flex flex-col justify-between shadow-2xl">
              <div>
                ${bentoTopRow}
                <h3 class="font-sans text-xl font-bold text-white mb-2">${esc(v(proj.title))}</h3>
                <p class="font-sans text-sm text-[#cbd5e1] leading-relaxed mb-4">${esc(v(proj.description))}</p>
                <div class="flex flex-wrap gap-1.5 mb-4">${tagsHtml}</div>
                ${linksHtml}
              </div>
              ${bentoFooterRow}
            </div>`;
          })
          .join('');
      }

      // 7. Agri-SAGE Aperture Portal
      setText('portal-badge', P.portal.badge);
      setText('portal-heading-prefix', P.portal.headingPrefix);
      setText('portal-heading-highlight', P.portal.headingHighlight);
      setText('portal-description', P.portal.description);
      const apertureImg = document.getElementById('aperture-image');
      if (apertureImg) {
        apertureImg.style.backgroundImage = `url('${v(P.portal.backgroundImage)}')`;
      }
      setText('portal-hud-top-left', P.portal.hudTopLeft);
      setText('portal-hud-coords', P.portal.hudCoordinates);
      setText('portal-hud-top-right', P.portal.hudTopRight);
      setText('portal-hud-center-badge', P.portal.hudCenterBadge);
      setText('portal-hud-center-title', P.portal.hudCenterTitle);
      const portalRtt = document.getElementById('portal-hud-rtt');
      if (portalRtt) {
        if (isBlank(P.portal.hudRttValue)) {
          portalRtt.remove();
        } else {
          portalRtt.textContent = 'RTT LATENCY: ' + v(P.portal.hudRttValue);
        }
      }
      setText('portal-hud-bottom-center', P.portal.hudBottomCenter);
      setText('portal-hud-bottom-right', P.portal.hudBottomRight);
      const portalBottomBar = document.getElementById('portal-hud-bottom-bar');
      if (portalBottomBar) {
        if (portalBottomBar.children.length === 0) {
          portalBottomBar.remove();
        } else if (
          portalBottomBar.children.length === 1 &&
          portalBottomBar.firstElementChild.id === 'portal-hud-bottom-center'
        ) {
          portalBottomBar.classList.remove('justify-between');
          portalBottomBar.classList.add('justify-center');
        }
      }

      // 8. Tools & Stack
      setText('stack-eyebrow', P.stack.eyebrow);
      setText('stack-heading-prefix', P.stack.headingPrefix);
      const stackGrid = document.getElementById('stack-grid');
      if (stackGrid) {
        stackGrid.innerHTML = P.stack.categories
          .map((cat) => {
            const isLime = cat.accent === 'lime';
            const cardHover = isLime
              ? 'hover:border-[#c3f400]/70 hover:shadow-[0_0_30px_rgba(195,244,0,0.12)]'
              : 'hover:border-[#ef4940]/70 hover:shadow-[0_0_30px_rgba(239,73,64,0.12)]';
            const headingColor = isLime ? 'text-[#c3f400]' : 'text-[#ef4940]';
            const chipHover = isLime
              ? 'hover:border-[#c3f400]/70 hover:text-[#c3f400]'
              : 'hover:border-[#ef4940]/70 hover:text-[#ef4940]';
            const chipsHtml = cat.items
              .filter((item) => !isBlank(item))
              .map(
                (item) =>
                  `<span class="px-2.5 py-1.5 rounded-lg bg-[#181a2e] border border-[#2c304c] text-center text-xs font-mono text-[#f1f5f9] font-medium ${chipHover} transition-colors">${esc(v(item))}</span>`
              )
              .join('');
            return `<div class="tilt-card p-6 rounded-2xl bg-gradient-to-b from-[#141624] to-[#0c0d15] border border-[#25283c] ${cardHover} transition-[border-color,box-shadow] duration-300 space-y-4 shadow-2xl">
              <div class="font-mono text-xs ${headingColor} font-bold tracking-wider">${esc(v(cat.title))}</div>
              <div class="grid grid-cols-2 gap-2">${chipsHtml}</div>
            </div>`;
          })
          .join('');
      }

      // 9. Milestones & Honors
      setText('milestones-eyebrow', P.milestones.eyebrow);
      setText('milestones-heading-prefix', P.milestones.headingPrefix);
      const milestonesGrid = document.getElementById('milestones-grid');
      if (milestonesGrid) {
        milestonesGrid.innerHTML = P.milestones.items
          .map((item, idx, arr) => {
            const hoverCls =
              item.accent === 'lime'
                ? 'hover:border-[#c3f400]/70 hover:shadow-[0_0_30px_rgba(195,244,0,0.12)]'
                : 'hover:border-[#ef4940]/70 hover:shadow-[0_0_30px_rgba(239,73,64,0.12)]';
            const spanCls = arr.length % 2 === 1 && idx === arr.length - 1 ? 'md:col-span-2' : '';
            const headerRow = renderHudRow(
              [
                { check: item.title, align: 'left', html: `<h3 class="font-sans text-lg font-bold text-white">${esc(v(item.title))}</h3>` },
                {
                  check: item.period,
                  align: 'right',
                  html: `<span class="font-mono text-xs text-[#c3f400] font-bold px-3 py-1 rounded-full bg-[#16182a] border border-[#2c304c] shadow-sm whitespace-nowrap shrink-0">${esc(v(item.period))}</span>`,
                },
              ],
              'gap-2 mb-3'
            );
            const orgHtml = !isBlank(item.organization)
              ? `<div class="font-mono text-xs text-[#ef4940] mb-3 font-bold drop-shadow-sm">${esc(v(item.organization))}</div>`
              : '';
            const descHtml = !isBlank(item.description)
              ? `<p class="font-sans text-sm text-[#cbd5e1] leading-relaxed font-normal">${esc(v(item.description))}</p>`
              : '';
            return `<div class="tilt-card milestone-card ${spanCls} p-7 rounded-2xl bg-gradient-to-b from-[#141624] to-[#0c0d15] border border-[#25283c] ${hoverCls} shadow-2xl transition-[border-color,box-shadow] duration-300">
              ${headerRow}
              ${orgHtml}
              ${descHtml}
            </div>`;
          })
          .join('');
      }

      // 9.5 Experience & Internships
      if (P.experience) {
        setText('experience-eyebrow', P.experience.eyebrow);
        setText('experience-heading-prefix', P.experience.headingPrefix);
        const expGrid = document.getElementById('experience-grid');
        if (expGrid) {
          const visibleExpItems = (P.experience.items || []).filter(
            (item) => !isBlank(item.role) && !isBlank(item.period)
          );
          expGrid.innerHTML = visibleExpItems
            .map((item, idx, arr) => {
              const isLime = item.accent === 'lime';
              const hoverCls = isLime
                ? 'hover:border-[#c3f400]/70 hover:shadow-[0_0_30px_rgba(195,244,0,0.12)]'
                : 'hover:border-[#ef4940]/70 hover:shadow-[0_0_30px_rgba(239,73,64,0.12)]';
              const spanCls = arr.length % 2 === 1 && idx === arr.length - 1 ? 'md:col-span-2' : '';
              const bulletColor = isLime ? 'text-[#c3f400]' : 'text-[#ef4940]';
              const bulletsHtml = (item.descriptions || [])
                .filter((d) => !isBlank(d))
                .map(
                  (d) =>
                    `<li class="flex items-start gap-2.5 text-sm text-[#cbd5e1] leading-relaxed font-normal"><span class="font-mono ${bulletColor} mt-0.5 shrink-0">&rsaquo;</span><span>${esc(v(d))}</span></li>`
                )
                .join('');
              const metaRow = renderHudRow(
                [
                  { check: item.company, align: 'left', html: `<span class="text-[#ef4940] font-bold drop-shadow-sm">${esc(v(item.company))}</span>` },
                  { check: item.mode, align: 'right', html: `<span class="text-[#94a3b8] font-medium">${esc(v(item.mode))}</span>` },
                ],
                'flex-wrap gap-2 font-mono text-xs mb-4'
              );
              return `<div class="tilt-card experience-card ${spanCls} p-7 rounded-2xl bg-gradient-to-b from-[#141624] to-[#0c0d15] border border-[#25283c] ${hoverCls} shadow-2xl transition-[border-color,box-shadow] duration-300">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                  <h3 class="font-sans text-lg sm:text-xl font-bold text-white">${esc(v(item.role))}</h3>
                  <span class="font-mono text-xs text-[#c3f400] font-bold px-3 py-1 rounded-full bg-[#16182a] border border-[#2c304c] shadow-sm whitespace-nowrap shrink-0">${esc(v(item.period))}</span>
                </div>
                ${metaRow}
                ${bulletsHtml ? `<ul class="space-y-2 font-sans">${bulletsHtml}</ul>` : ''}
              </div>`;
            })
            .join('');
        }
      }

      // 10. Contact / Hiring Gateway
      const ctaBg = document.getElementById('cta-stage-bg');
      if (ctaBg) {
        ctaBg.style.backgroundImage = `url('${v(P.contact.backgroundImage)}')`;
      }
      setText('terminal-availability', P.identity.availabilityUpper);
      setText('terminal-headline-prefix', P.contact.headlinePrefix);
      setText('terminal-headline-highlight', P.contact.headlineHighlight);
      setText('terminal-description', P.contact.availabilityDescription);
      setText('email-address', P.contact.email);
      setText('copy-label', P.contact.copyButtonLabel);
      const terminalSocials = document.getElementById('terminal-socials');
      if (terminalSocials) {
        terminalSocials.innerHTML = P.socials
          .map(

    // Universal Cross-Browser Clipboard Helper with Fallback
    function safeCopyToClipboard(text, onSuccess, onFallback) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(ta);
          if (successful) {
            onSuccess();
          } else if (onFallback) {
            onFallback();
          }
        } catch (e) {
          if (onFallback) onFallback();
        }
      }
    }

    // Shared clamped delta-time helper immune to cold-start RAF vs performance.now skew
    function computeFrameDt(currentTime, lastTime) {
      if (lastTime === null) return 0.016;
      return Math.min(0.1, Math.max(0.001, (currentTime - lastTime) / 1000));
    }

    // 2. Kinetic Runtime Radar / Geometry Canvas Animation (High-DPI & 120 FPS Delta-Time)
    (function initKineticCanvas() {
      const canvas = document.getElementById('kinetic-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const logicalW = 280;
      const logicalH = 150;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = logicalW * dpr;
      canvas.height = logicalH * dpr;
      canvas.style.width = logicalW + 'px';
      canvas.style.height = logicalH + 'px';
      ctx.scale(dpr, dpr);

      let angle = 0;
      let lastTime = performance.now();
      let isInView = true;
      let rafId = null;

      function drawFrame() {
        ctx.clearRect(0, 0, logicalW, logicalH);
        const cx = logicalW / 2;
        const cy = logicalH / 2;

        // Concentric Dashed Radar Circles
        [30, 52, 68].forEach((r, idx) => {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = idx === 1 ? 'rgba(239, 73, 64, 0.4)' : 'rgba(195, 244, 0, 0.25)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
        });

        // Center crosshair
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy);
        ctx.lineTo(cx + 15, cy);
        ctx.moveTo(cx, cy - 15);
        ctx.lineTo(cx, cy + 15);
        ctx.stroke();

        // Orbiting Node 1 (Lime)
        const ox1 = cx + Math.cos(angle) * 52;
        const oy1 = cy + Math.sin(angle) * 52;
        ctx.beginPath();
        ctx.arc(ox1, oy1, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#c3f400';
        ctx.shadowColor = '#c3f400';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Orbiting Node 2 (Red)
        const ox2 = cx + Math.cos(-angle * 1.4) * 68;
        const oy2 = cy + Math.sin(-angle * 1.4) * 68;
        ctx.beginPath();
        ctx.arc(ox2, oy2, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4940';
        ctx.shadowColor = '#ef4940';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function render(currentTime) {
        if (!isInView || document.hidden) {
          rafId = null;
          return;
        }
        const dt = computeFrameDt(currentTime, lastTime);
        lastTime = currentTime;
        angle += 1.5 * dt;
        drawFrame();
        rafId = requestAnimationFrame(render);
      }

      function startLoop() {
        if (rafId !== null || !isInView || document.hidden) return;
        lastTime = null;
        rafId = requestAnimationFrame(render);
      }

      drawFrame();
      if (typeof IntersectionObserver !== 'undefined') {
        const obs = new IntersectionObserver((entries) => {
          isInView = entries[0].isIntersecting;
          if (isInView) startLoop();
        }, { rootMargin: '300px' });
        obs.observe(canvas);
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isInView) startLoop();
      });
      startLoop();
    })();

    // 3. MIRLO Desktop Dynamic Audio Equalizer Spectrum (High-DPI & 120 FPS Delta-Time)
    (function initVoiceWaveform() {
      const canvas = document.getElementById('voice-waveform-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function setupDpr() {
        const rect = canvas.getBoundingClientRect();
        const logicalW = rect.width > 0 ? rect.width : 400;
        const logicalH = rect.height > 0 ? rect.height : 130;
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = logicalW * dpr;
        canvas.height = logicalH * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        return { logicalW, logicalH };
      }

      let dims = setupDpr();
      window.addEventListener('resize', () => {
        dims = setupDpr();
        drawFrame();
      }, { passive: true });

      const numBars = 36;
      let phase = 0;
      let lastTime = performance.now();
      let isInView = true;
      let rafId = null;

      function drawFrame() {
        const w = dims.logicalW;
        const h = dims.logicalH;
        ctx.clearRect(0, 0, w, h);

        const barWidth = Math.max(2.5, (w / numBars) * 0.45);
        const gap = (w - (numBars * barWidth)) / (numBars - 1);
        const cy = h / 2;

        for (let i = 0; i < numBars; i++) {
          const x = i * (barWidth + gap);
          const distFromCenter = Math.abs(i - numBars / 2) / (numBars / 2);
          const weight = Math.cos(distFromCenter * Math.PI * 0.45);
          const wave1 = Math.sin(phase + i * 0.45);
          const wave2 = Math.cos(phase * 1.5 - i * 0.3);
          const barHeight = Math.max(8, (wave1 * 0.5 + wave2 * 0.5 + 1.2) * (h * 0.32) * weight);

          let color = '#ef4940';
          if (distFromCenter < 0.3) {
            color = '#c3f400';
          } else if (distFromCenter < 0.6) {
            color = '#ff9800';
          }

          ctx.fillStyle = color;
          ctx.beginPath();
          if (typeof ctx.roundRect === 'function') {
            ctx.roundRect(x, cy - barHeight / 2, barWidth, barHeight, 2);
          } else {
            ctx.rect(x, cy - barHeight / 2, barWidth, barHeight);
          }
          ctx.fill();
        }
      }

      function render(currentTime) {
        if (!isInView || document.hidden) {
          rafId = null;
          return;
        }
        const dt = computeFrameDt(currentTime, lastTime);
        lastTime = currentTime;
        phase += 4.2 * dt;
        drawFrame();
        rafId = requestAnimationFrame(render);
      }

      function startLoop() {
        if (rafId !== null || !isInView || document.hidden) return;
        lastTime = null;
        rafId = requestAnimationFrame(render);
      }

      drawFrame();
      if (typeof IntersectionObserver !== 'undefined') {
        const obs = new IntersectionObserver((entries) => {
          isInView = entries[0].isIntersecting;
          if (isInView) startLoop();
        }, { rootMargin: '300px' });
        obs.observe(canvas);
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isInView) startLoop();
      });
      startLoop();
    })();

    // 4. Entity Resolution Batch Scrubber Progress (Smooth 120 FPS Gliding Progress)
    (function initScrubber() {
      const bar = document.getElementById('scrubber-bar');
      const progress = document.getElementById('scrubber-progress');
      const tcDisplay = document.getElementById('timecode-display');
      if (!bar || !progress) return;
      const pairCountText =
        window.PROFILE && window.PROFILE.projects.featured[2]
          ? profileVal(window.PROFILE.projects.featured[2].viewport.pairCount)
          : '';

      let pct = 45;
      let lastBatch = -1;
      let lastTime = performance.now();
      let rafId = null;

      function applyProgress() {
        progress.style.width = pct.toFixed(2) + '%';
        const batch = Math.floor((pct / 100) * 120) + 1;
        if (tcDisplay && !isBlank(pairCountText) && batch !== lastBatch) {
          lastBatch = batch;
          tcDisplay.textContent = `BATCH: ${String(batch).padStart(4, '0')} // ${pairCountText}`;
        }
      }

      function step(currentTime) {
        if (document.hidden) {
          rafId = null;
          return;
        }
        const dt = computeFrameDt(currentTime, lastTime);
        lastTime = currentTime;

        pct = (pct + 2.4 * dt) % 100;
        applyProgress();
        rafId = requestAnimationFrame(step);
      }

      function startLoop() {
        if (rafId !== null || document.hidden) return;
        lastTime = null;
        rafId = requestAnimationFrame(step);
      }

      applyProgress();
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) startLoop();
      });
      startLoop();

      // Interactive click to seek
      bar.addEventListener('click', (e) => {
        const rect = bar.getBoundingClientRect();
        pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        applyProgress();
      });
    })();

    // ========================================================
    // 5. HIGH-PRECISION DAMPED CURSOR FOLLOWER (120 FPS DECOUPLED)
    // ========================================================
    (function initCursor() {
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      if (!dot || !ring) return;

      // Only suppress custom cursor on touch-only small screens (< 768px)
      if (window.matchMedia('(pointer: coarse) and (max-width: 768px)').matches) {
        dot.style.display = 'none';
        ring.style.display = 'none';
        return;
      }

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let ringX = mouseX;
      let ringY = mouseY;
      let isVisible = false;
      let rafId = null;
      let lastTime = performance.now();

      function applyCursorPositions() {
        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        ring.style.transform = `translate3d(${ringX.toFixed(2)}px, ${ringY.toFixed(2)}px, 0) translate(-50%, -50%)`;
      }

      function startLoop() {
        if (rafId !== null || document.hidden) return;
        lastTime = null;
        rafId = requestAnimationFrame(tick);
      }

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (!isVisible) {
          isVisible = true;
          ringX = mouseX;
          ringY = mouseY;
          dot.style.opacity = '1';
          ring.style.opacity = '1';
        }
        startLoop();
      }, { passive: true });

      document.addEventListener('mouseleave', () => {
        isVisible = false;
        dot.style.opacity = '0';
        ring.style.opacity = '0';
      });

      function tick(currentTime) {
        if (document.hidden) {
          rafId = null;
          return;
        }
        const dt = computeFrameDt(currentTime, lastTime);
        lastTime = currentTime;

        const lerpFactor = 1 - Math.exp(-15 * dt);
        ringX += (mouseX - ringX) * lerpFactor;
        ringY += (mouseY - ringY) * lerpFactor;
        applyCursorPositions();

        const remaining = Math.abs(mouseX - ringX) + Math.abs(mouseY - ringY);
        if (!isVisible && remaining < 0.05) {
          rafId = null;
          return;
        }
        if (remaining < 0.05) {
          ringX = mouseX;
          ringY = mouseY;
          applyCursorPositions();
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      applyCursorPositions();

      // Expand ring when hovering interactive elements
      const targets = document.querySelectorAll('a, button, input, .tilt-card, [role="button"]');
      targets.forEach(el => {
        el.addEventListener('mouseenter', () => document.body.classList.add('cursor-active'));
        el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-active'));
      });
    })();

    // ========================================================
    // 6. 3D PERSPECTIVE CARD TILT PHYSICS (120 FPS RAF DAMPING)
    // ========================================================
    (function initTiltCards() {
      const cards = document.querySelectorAll('.tilt-card');
      if (!cards.length) return;

      const cardStates = new Map();
      const activeStates = new Set();
      let rafId = null;
      let lastTime = performance.now();

      function startTiltLoop() {
        if (rafId !== null || document.hidden || activeStates.size === 0) return;
        lastTime = null;
        rafId = requestAnimationFrame(tiltTick);
      }

      cards.forEach(card => {
        const state = {
          card,
          rect: null,
          targetX: 0,
          targetY: 0,
          currentX: 0,
          currentY: 0,
          isHovered: false
        };
        cardStates.set(card, state);

        function updateRect() {
          state.rect = card.getBoundingClientRect();
        }

        card.addEventListener('mouseenter', () => {
          updateRect();
          state.isHovered = true;
          activeStates.add(state);
          startTiltLoop();
        });

        card.addEventListener('mousemove', (e) => {
          if (!state.rect) updateRect();
          const x = e.clientX - state.rect.left;
          const y = e.clientY - state.rect.top;
          const centerX = state.rect.width / 2;
          const centerY = state.rect.height / 2;

          state.targetX = -((y - centerY) / (centerY || 1)) * 4.5;
          state.targetY = ((x - centerX) / (centerX || 1)) * 4.5;
          activeStates.add(state);
          startTiltLoop();
        });

        card.addEventListener('mouseleave', () => {
          state.isHovered = false;
          state.targetX = 0;
          state.targetY = 0;
          activeStates.add(state);
          startTiltLoop();
        });
      });

      function tiltTick(currentTime) {
        if (document.hidden || activeStates.size === 0) {
          rafId = null;
          return;
        }
        const dt = computeFrameDt(currentTime, lastTime);
        lastTime = currentTime;
        const lerpFactor = 1 - Math.exp(-14 * dt);

        activeStates.forEach(state => {
          const diffX = state.targetX - state.currentX;
          const diffY = state.targetY - state.currentY;

          if (Math.abs(diffX) > 0.005 || Math.abs(diffY) > 0.005) {
            state.currentX += diffX * lerpFactor;
            state.currentY += diffY * lerpFactor;
            const z = state.isHovered ? 4 : 0;
            state.card.style.transform = `perspective(1000px) rotateX(${state.currentX.toFixed(2)}deg) rotateY(${state.currentY.toFixed(2)}deg) translateZ(${z}px)`;
          } else if (!state.isHovered) {
            state.currentX = 0;
            state.currentY = 0;
            state.card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            activeStates.delete(state);
          } else {
            state.currentX = state.targetX;
            state.currentY = state.targetY;
            state.card.style.transform = `perspective(1000px) rotateX(${state.currentX.toFixed(2)}deg) rotateY(${state.currentY.toFixed(2)}deg) translateZ(4px)`;
            activeStates.delete(state);
          }
        });

        if (activeStates.size > 0) {
          rafId = requestAnimationFrame(tiltTick);
        } else {
          rafId = null;
        }
      }

      const refreshHoveredRects = () => {
        cardStates.forEach(state => {
          if (state.isHovered) state.rect = state.card.getBoundingClientRect();
        });
      };
      window.addEventListener('resize', refreshHoveredRects, { passive: true });
      window.addEventListener('scroll', refreshHoveredRects, { passive: true });
    })();
