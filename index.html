      <div class="section-header mb-14">
        <!-- Top Pill Badge -->
        <div id="stack-eyebrow" class="inline-block px-3.5 py-1 rounded-full bg-[#121422] border border-[#282c44] text-[11px] font-mono text-[#c3f400] tracking-wider uppercase mb-3 font-semibold shadow-sm"></div>
        <!-- Title with Yellow Period -->
        <h2 class="font-sans text-4xl sm:text-5xl font-extrabold text-white tracking-tight">
          <span id="stack-heading-prefix"></span><span class="text-[#c3f400]">.</span>
        </h2>
      </div>

      <!-- 4 Tech Stack Bento Cards -->
      <div id="stack-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 5.5 ENGINEERING MILESTONES & HONORS -->
  <!-- ========================================== -->
  <section id="milestones" class="py-24 sm:py-32 bg-[#0b0c10] border-t border-[#181922] overflow-x-clip">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10">
      
      <div class="section-header mb-14">
        <div id="milestones-eyebrow" class="font-mono text-xs text-[#ef4940] uppercase tracking-wider mb-2 font-bold"></div>
        <h2 class="font-sans text-4xl sm:text-5xl font-extrabold text-white tracking-tight">
          <span id="milestones-heading-prefix"></span><span class="text-[#c3f400]">.</span>
        </h2>
      </div>

      <!-- Vertical Milestones Track Timeline -->
      <div class="relative">
        <!-- Vertical glowing guideline -->
        <div class="absolute left-0 top-3 bottom-3 w-[2px] bg-[#24273c] hidden md:block">
          <div id="milestone-progress-line" class="absolute top-0 left-0 w-full bg-gradient-to-b from-[#ef4940] via-[#c3f400] to-[#ef4940] h-0 shadow-[0_0_12px_rgba(239,73,64,0.8)]"></div>
          <!-- Running glow node -->
          <div id="milestone-runner" class="absolute -left-[5px] top-0 w-3 h-3 rounded-full bg-[#c3f400] shadow-[0_0_10px_#c3f400] -translate-y-1/2"></div>
        </div>

        <div id="milestones-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 md:pl-8"></div>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 5.75 INTERNSHIPS & EXPERIENCE -->
  <!-- ========================================== -->
  <section id="experience" class="py-24 sm:py-32 bg-[#08090e] border-t border-[#181922] overflow-x-clip">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10">
      <div class="section-header mb-14">
        <div id="experience-eyebrow" class="font-mono text-xs text-[#ef4940] uppercase tracking-wider mb-2 font-bold"></div>
        <h2 class="font-sans text-4xl sm:text-5xl font-extrabold text-white tracking-tight">
          <span id="experience-heading-prefix"></span><span class="text-[#c3f400]">.</span>
        </h2>
      </div>
      <div id="experience-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 6. COMMISSION / HIRING GATEWAY (CTA) -->
  <!-- ========================================== -->
  <section id="terminal" class="relative py-28 sm:py-36 bg-[#090a0e] overflow-hidden">
    <!-- Futuristic Red Laser Corridor Stage Background -->
    <div id="cta-stage-bg" class="absolute inset-0 bg-cover bg-center pointer-events-none opacity-90 will-change-transform"></div>
    
    <div class="max-w-5xl mx-auto px-4 sm:px-6 relative z-10 text-center flex flex-col items-center">
      
      <!-- Section Header -->
      <div class="section-header flex flex-col items-center">
        <!-- Status Badge -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#0e0f16]/90 border border-[#c3f400]/40 backdrop-blur-md mb-8">
          <span class="w-2 h-2 rounded-full bg-[#c3f400] animate-ping"></span>
          <span id="terminal-availability" class="font-mono text-xs text-[#c3f400] tracking-wider uppercase font-semibold"></span>
        </div>

        <!-- Main Headline -->
        <h2 class="font-sans text-3xl xs:text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight leading-tight mb-8">
          <span id="terminal-headline-prefix"></span> <br>
          <span id="terminal-headline-highlight" class="text-[#ef4940] text-glow-red"></span>
        </h2>

        <p id="terminal-description" class="font-sans text-sm sm:text-base text-[#e2e8f0] max-w-xl mx-auto mb-8 leading-relaxed font-normal"></p>
      </div>

      <!-- Glassmorphic Copy Email Box -->
      <div class="w-full max-w-md mx-auto p-2.5 bg-[#0c0e18]/95 border-2 border-[#2d3250] rounded-2xl flex items-center justify-between shadow-[0_0_35px_rgba(195,244,0,0.15)] backdrop-blur-lg mb-8 relative">
        <div class="flex items-center gap-2.5 pl-4 overflow-hidden">
          <svg class="w-[20px] h-[20px] text-[#ef4940] fill-current shrink-0" aria-hidden="true"><use href="#icon-alternate_email"></use></svg>
          <span class="font-mono text-xs sm:text-sm text-white font-semibold truncate" id="email-address"></span>
        </div>
        
        <!-- Copy Button in Bright Neon Lime -->
        <button 
          id="copy-btn" 
          onclick="copyEmail()" 
          class="magnetic-btn px-5 py-2.5 rounded-xl bg-[#c3f400] hover:bg-[#d8ff1a] text-[#08090c] font-mono text-xs font-black transition-colors duration-150 shrink-0 active:scale-95 shadow-lg shadow-[#c3f400]/30 flex items-center gap-1.5"
        >
          <span id="copy-label"></span>
        </button>

        <!-- Sparkle Star Accent Icon floating nearby -->
        <div class="absolute -right-7 -bottom-3 text-white/30 hidden sm:block">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
          </svg>
        </div>
      </div>

      <!-- Social Links Bar with Dark Glass Backdrop -->
      <div id="terminal-socials" class="mt-4 inline-flex flex-wrap items-center justify-center gap-3 sm:gap-6 px-6 py-2.5 rounded-full bg-[#0c0e18]/95 border border-[#2d3250] backdrop-blur-md shadow-2xl text-xs font-mono text-[#cbd5e1]"></div>

    </div>
  </section>

  <!-- ========================================== -->
  <!-- 7. FOOTER -->
  <!-- ========================================== -->
  <footer class="w-full bg-[#07080c] border-t border-[#1a1b24]">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 sm:px-6 md:px-10 py-8 gap-6">
      
      <!-- Brand Logo -->
      <div id="footer-brand" class="font-sans text-2xl sm:text-3xl font-black text-[#ef4940] tracking-tight"></div>

      <!-- Center Links -->
      <div id="footer-links" class="flex flex-wrap items-center justify-center gap-6 text-xs font-mono text-[#cbd5e1]"></div>

      <!-- Copyright -->
      <div id="footer-copyright" class="font-mono text-[11px] text-[#94a3b8] text-center md:text-right font-medium"></div>
    </div>
  </footer>

  <!-- ========================================== -->
  <!-- COMMAND PALETTE MODAL (Cmd+K / Ctrl+K) -->
  <!-- ========================================== -->
  <dialog id="cmd-palette" class="bg-transparent backdrop:bg-black/80 backdrop:backdrop-blur-md p-4 max-w-xl w-full m-auto focus:outline-none">
    <div class="bg-[#0f111d] border border-[#2d324d] rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden">
      <!-- Search Input -->
      <div class="p-4 border-b border-[#22263d] flex items-center gap-3">
        <svg class="w-[20px] h-[20px] text-[#ef4940] fill-current shrink-0" aria-hidden="true"><use href="#icon-search"></use></svg>
        <input id="palette-search" type="text" placeholder="" class="w-full bg-transparent border-none text-sm text-white focus:outline-none font-mono placeholder:text-[#94a3b8]" autocomplete="off"/>
        <button onclick="toggleCommandPalette()" class="text-xs font-mono text-[#94a3b8] hover:text-white px-2 py-0.5 rounded border border-[#2d324d]">ESC</button>
      </div>
      <!-- Items list -->
      <div class="p-3 max-h-80 overflow-y-auto space-y-1 font-mono text-xs" id="palette-items" data-lenis-prevent></div>
    </div>
  </dialog>


</body>
</html>
