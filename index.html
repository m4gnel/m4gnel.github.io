    // ========================================================
    // 6.6 MAGNETIC BUTTON PHYSICS (DELTA-TIME LERP DAMPING)
    // ========================================================
    function initMagneticButtons() {
      const buttons = document.querySelectorAll('.magnetic-btn');
      buttons.forEach((btn) => {
        let rect = null;
        btn.addEventListener('mouseenter', () => {
          rect = btn.getBoundingClientRect();
        });
        btn.addEventListener('mousemove', (e) => {
          if (!rect) rect = btn.getBoundingClientRect();
          const x = (e.clientX - (rect.left + rect.width / 2)) * 0.35;
          const y = (e.clientY - (rect.top + rect.height / 2)) * 0.35;
          if (typeof gsap !== 'undefined') {
            gsap.to(btn, { x, y, duration: 0.25, ease: 'power2.out', overwrite: 'auto' });
          }
        });
        btn.addEventListener('mouseleave', () => {
          rect = null;
          if (typeof gsap !== 'undefined') {
            gsap.to(btn, { x: 0, y: 0, duration: 0.65, ease: 'elastic.out(1, 0.4)', overwrite: 'auto' });
          }
        });
      });
    }

    // ========================================================
    // 7. MASTER SCROLL ENGINE (LENIS) & GSAP SCROLLTRIGGER
    // ========================================================
    let lenisInstance = null;
    let heroEntranceTl = null;
    const siteHeader = document.querySelector('header');
    const navAnchors = Array.from(document.querySelectorAll('header nav a[href^="#"]'));

    function setActiveNavSection(id) {
      navAnchors.forEach((a) => {
        a.classList.toggle('is-nav-active', Boolean(id && a.getAttribute('href') === `#${id}`));
      });
    }

    function updateHeaderScrollState(scrollY) {
      if (siteHeader) {
        siteHeader.classList.toggle('is-scrolled', scrollY > 24);
      }
    }

    function initMasterMotion() {
      // 1. Initialize Lenis Smooth Scroll with Physical LERP (0.09)
      if (typeof Lenis !== 'undefined') {
        lenisInstance = new Lenis({
          lerp: 0.09,
          orientation: 'vertical',
          gestureOrientation: 'vertical',
          smoothWheel: true,
          wheelMultiplier: 1.0,
          touchMultiplier: 1.5,
          syncTouch: false,
        });

        window.__lenis = lenisInstance;
        document.documentElement.classList.add('lenis', 'lenis-smooth');

        if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
          gsap.registerPlugin(ScrollTrigger);

          // Synchronize Lenis coordinates directly with ScrollTrigger & header
          lenisInstance.on('scroll', (e) => {
            ScrollTrigger.update();
            updateHeaderScrollState(e.scroll);
          });

          // Drive Lenis tick through GSAP ticker for single-RAF frame lock
          gsap.ticker.add((time) => {
            lenisInstance.raf(time * 1000);
          });
          gsap.ticker.lagSmoothing(0);
        } else {
          function raf(time) {
            lenisInstance.raf(time);
            requestAnimationFrame(raf);
          }
          requestAnimationFrame(raf);
        }

        // Smooth Anchor Links with Fixed Header Offset
        document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener('click', (e) => {
            const targetId = anchor.getAttribute('href');
            if (cmdPalette && cmdPalette.open) {
              cmdPalette.close();
            }
            lenisInstance.start();

            if (targetId === '#') {
              e.preventDefault();
              lenisInstance.scrollTo(0, { duration: 1.0 });
            } else if (targetId) {
              const targetEl = document.querySelector(targetId);
              if (targetEl) {
                e.preventDefault();
                lenisInstance.scrollTo(targetEl, { offset: -64, duration: 1.0 });
              }
            }
          });
        });
      }

      updateHeaderScrollState(window.scrollY || 0);

      // 2. Interactive Physics & Magnetic Attraction
      initMagneticButtons();

      // 3. Hero Load Entrance
      initHeroEntrance();

      // 4. Synchronized ScrollTrigger Choreography
      if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        initScrollTriggers();
      }
    }

    // Master Hero Page Load Entrance Animation
    function initHeroEntrance() {
      if (typeof gsap === 'undefined') return;

      const loadTl = gsap.timeline({
        defaults: { ease: 'power3.out', clearProps: 'opacity,transform' }
      });

      loadTl
        .from('#hero-bg-text', {
          scale: 0.95,
          opacity: 0.45,
          duration: 0.85,
          ease: 'power2.out',
        })
        .from('#hero-portrait', {
          y: 22,
          scale: 0.97,
          opacity: 0,
          duration: 0.75,
        }, '-=0.6')
        .from('#hero-title-group', {
          y: 18,
          opacity: 0,
          duration: 0.65,
        }, '-=0.5')
        .from('#figma-bounds', {
          y: 14,
          opacity: 0,
          duration: 0.6,
        }, '-=0.45')
        .from('.hero-telemetry', {
          y: 12,
          opacity: 0,
          duration: 0.55,
          stagger: 0.05,
        }, '-=0.4');

      heroEntranceTl = loadTl;
      if ((window.scrollY || 0) > 40) {
        heroEntranceTl.progress(1);
      }
    }

    // Shared grid stagger helper: cascades per visual row on desktop/tablet and cleanly on mobile
    function revealGridCards(cards, { colsDesktop = 2, colsTablet = 2, y = 26, scale = 0.985, duration = 0.65 } = {}) {
      const list = gsap.utils.toArray(cards);
      const getCols = () => (window.innerWidth >= 1024 ? colsDesktop : (window.innerWidth >= 768 ? colsTablet : 1));

      list.forEach((card, idx) => {
        gsap.from(card, {
          scrollTrigger: {
            trigger: card,
            start: 'top 90%',
            toggleActions: 'play none none none',
            once: true,
          },
          opacity: 0,
          y,
          scale,
          duration,
          delay: () => {
            const cols = getCols();
            return cols > 1 ? (idx % cols) * 0.07 : 0;
          },
          ease: 'power3.out',
          clearProps: 'opacity,transform',
        });
      });
    }

    function initScrollTriggers() {
      const mm = gsap.matchMedia();

      // ========================================================
      // A. HERO MULTI-PLANE OPTICAL DEPTH SCRUBBING
      // ========================================================
      gsap.to('#hero-portrait img', {
        y: -8,
        duration: 3.5,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut',
      });

      gsap.to('#hero-glow-pulse', {
        scale: 1.15,
        opacity: 0.7,
        duration: 4.5,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut',
      });

      const heroTl = gsap.timeline({
        scrollTrigger: {
          trigger: '#hero',
          start: 'top top',
          end: 'bottom top',
          scrub: 0.25,
          invalidateOnRefresh: true,
          onUpdate: (self) => {
            if (self.progress > 0.01 && heroEntranceTl && heroEntranceTl.isActive()) {
              heroEntranceTl.progress(1);
            }
          }
        }
      });

      // Explicit rest baselines prevent refresh() from ever baking mid-entrance state
      heroTl
        .fromTo('#hero-bg-text',
          { yPercent: 0, scale: 1, opacity: 1 },
          { yPercent: 22, scale: 1.04, opacity: 0.82, ease: 'none', immediateRender: false },
          0
        )
        .fromTo('#hero-glow',
          { scale: 1, opacity: 1 },
          { scale: 1.3, opacity: 0.35, ease: 'none', immediateRender: false },
          0
        )
        .fromTo('#hero-portrait',
          { y: 0, scale: 1 },
          { y: -48, scale: 0.97, ease: 'none', immediateRender: false },
          0
        )
        .fromTo('#hero-title-group',
          { y: 0, opacity: 1 },
          { y: -28, opacity: 0.96, ease: 'none', immediateRender: false },
          0
        )
        .fromTo('#figma-bounds',
          { y: 0 },
          { y: -16, ease: 'none', immediateRender: false },
          0
        )
        .fromTo('.hero-telemetry',
          { y: 0, opacity: 1 },
          { y: -14, opacity: 0.92, ease: 'none', immediateRender: false },
          0
        );

      // ========================================================
      // B. EDITORIAL SECTION HEADERS
      // ========================================================
      gsap.utils.toArray('.section-header').forEach((header) => {
        gsap.from(header.children, {
          scrollTrigger: {
            trigger: header,
            start: 'top 90%',
            toggleActions: 'play none none none',
            once: true,
          },
          opacity: 0,
          y: 26,
          duration: 0.65,
          stagger: 0.06,
          ease: 'power3.out',
          clearProps: 'opacity,transform',
        });
      });

      // Wavy underline draw on Approach section entrance
      ScrollTrigger.create({
        trigger: '#philosophy',
        start: 'top 85%',
        once: true,
        onEnter: () => {
          const wavy = document.querySelector('.wavy-svg-line');
          if (wavy) wavy.classList.add('is-drawn');
        }
      });

      // ========================================================
      // C. APPROACH BENTO CARDS ENTRANCE & PARALLAX
      // ========================================================
      const bentoCards = gsap.utils.toArray('#philosophy .bento-card');
      if (bentoCards.length > 0) {
        revealGridCards(bentoCards, { colsDesktop: 3, colsTablet: 3, y: 28, scale: 0.98, duration: 0.65 });

        // Decoupled via CSS `translate` so 3D `.tilt-card` hover `transform` never collides
        if (bentoCards.length === 3) {
          mm.add('(min-width: 768px)', () => {
            const lift = { yp: 0 };
            const applyLift = () => {
              bentoCards[1].style.translate = `0 ${lift.yp.toFixed(2)}%`;
            };
            gsap.fromTo(lift,
              { yp: 0 },
              {
                yp: -6,
                ease: 'none',
                immediateRender: false,
                onUpdate: applyLift,
                scrollTrigger: {
                  trigger: '#philosophy',
                  start: 'top 55%',
                  end: 'bottom top',
                  scrub: 0.25,
                  invalidateOnRefresh: true,
                }
              }
            );
            return () => {
              bentoCards[1].style.translate = '';
            };
          });
        }
      }

      // ========================================================
      // D. GRAPHIC DESIGN LAB (MONOGRAM ARCHITECTURE & SWATCHES)
      // ========================================================
      revealGridCards('#design > .max-w-7xl > .grid > div', { colsDesktop: 2, colsTablet: 2, y: 28, scale: 0.985, duration: 0.65 });

      ScrollTrigger.create({
        trigger: '#design',
        start: 'top 82%',
        once: true,
        onEnter: () => {
          gsap.from('#monogram-svg line, #monogram-svg circle:not([r="32"]):not([fill])', {
            opacity: 0,
            scale: 0.92,
            duration: 0.65,
            stagger: 0.03,
            ease: 'power2.out',
            transformOrigin: 'center center'
          });

          const pathM = document.getElementById('monogram-letter-m');
          if (pathM) {
            gsap.fromTo(pathM,
              { strokeDasharray: 350, strokeDashoffset: 350 },
              { strokeDashoffset: 0, duration: 0.95, ease: 'power2.out', delay: 0.15 }
            );
          }

          const circleO = document.getElementById('monogram-letter-o');
          if (circleO) {
            gsap.fromTo(circleO,
              { strokeDasharray: 205, strokeDashoffset: 205 },
              { strokeDashoffset: 0, duration: 0.85, ease: 'power2.out', delay: 0.25 }
            );
          }

          const period = document.getElementById('monogram-period');
          if (period) {
            gsap.from(period, {
              scale: 0,
              opacity: 0,
              duration: 0.35,
              ease: 'back.out(2)',
              delay: 0.55,
              transformOrigin: 'center center'
            });
          }

          gsap.from('#monogram-svg text', {
            opacity: 0,
            y: 6,
            duration: 0.45,
            stagger: 0.04,
            ease: 'power2.out',
            delay: 0.45
          });
        }
      });

      gsap.from('#design .space-y-2\\.5 > button', {
        scrollTrigger: {
          trigger: '#design .space-y-2\\.5',
          start: 'top 90%',
          toggleActions: 'play none none none',
          once: true,
        },
        opacity: 0,
        y: 12,
        duration: 0.45,
        stagger: 0.04,
        ease: 'power2.out',
        clearProps: 'opacity,transform',
      });

      // ========================================================
      // E. EDUCATION CARD & COURSEWORK PILLS (UNIFIED NO-FLASH TIMING)
      // ========================================================
      gsap.from('.academics-card', {
        scrollTrigger: {
          trigger: '#academics',
          start: 'top 90%',
          toggleActions: 'play none none none',
          once: true,
        },
        opacity: 0,
        y: 26,
        scale: 0.985,
        duration: 0.65,
        ease: 'power3.out',
        clearProps: 'opacity,transform',
      });

      gsap.from('#academics .flex.flex-wrap.gap-2 > span', {
        scrollTrigger: {
          trigger: '#academics',
          start: 'top 90%',
          toggleActions: 'play none none none',
          once: true,
        },
        opacity: 0,
        y: 8,
        duration: 0.42,
        delay: 0.1,
        stagger: 0.025,
        ease: 'power2.out',
        clearProps: 'opacity,transform',
      });

      // ========================================================
      // F. SELECTED PROJECTS TERMINALS & TACTILE CARD STACKING
      // ========================================================
      const terminals = gsap.utils.toArray('.project-terminal');
      terminals.forEach((term) => {
        gsap.from(term, {
          scrollTrigger: {
            trigger: term,
            start: 'top 90%',
            toggleActions: 'play none none none',
            once: true,
          },
          opacity: 0,
          y: 30,
          duration: 0.65,
          ease: 'power3.out',
          clearProps: 'opacity,transform',
        });
      });

      // Card stacking decoupled via CSS `scale` & `translate` so `.tilt-card` hover composes cleanly
      mm.add('(min-width: 768px)', () => {
        terminals.forEach((term, idx) => {
          if (idx >= terminals.length - 1) return;
          const stack = { s: 1, y: 0, op: 1 };
          const applyStack = () => {
            term.style.scale = stack.s.toFixed(4);
            term.style.translate = `0 ${stack.y.toFixed(2)}px`;
            term.style.opacity = stack.op.toFixed(3);
          };
          gsap.fromTo(stack,
            { s: 1, y: 0, op: 1 },
            {
              s: 0.98,
              y: 14,
              op: 0.94,
              ease: 'none',
              immediateRender: false,
              onUpdate: applyStack,
              scrollTrigger: {
                trigger: terminals[idx + 1],
                start: 'top 85%',
                end: 'top 30%',
                scrub: 0.25,
                invalidateOnRefresh: true,
              }
            }
          );
        });
        return () => {
          terminals.forEach((term) => {
            term.style.scale = '';
            term.style.translate = '';
            term.style.opacity = '';
          });
        };
      });

      revealGridCards('#work .grid .tilt-card', { colsDesktop: 2, colsTablet: 2, y: 26, scale: 0.98, duration: 0.65 });

      // ========================================================
      // G. AGRI-SAGE PIPELINE PORTAL (EXPAND -> HOLD -> CONTRACT)
      // ========================================================
      const apertureMask = document.getElementById('aperture-mask');
      const portalClip = { tb: 18, lr: 14, r: 48 };
      function applyPortalClip() {
        if (!apertureMask) return;
        const val = `inset(${portalClip.tb.toFixed(2)}% ${portalClip.lr.toFixed(2)}% ${portalClip.tb.toFixed(2)}% ${portalClip.lr.toFixed(2)}% round ${portalClip.r.toFixed(1)}px)`;
        apertureMask.style.clipPath = val;
        apertureMask.style.webkitClipPath = val;
      }
      applyPortalClip();

      mm.add({
        isPinned: '(min-width: 768px) and (min-height: 680px)',
        isCompact: '(max-width: 767px), (max-height: 679px)',
      }, (context) => {
        const { isPinned } = context.conditions;
        const apertureTl = gsap.timeline({
          scrollTrigger: {
            trigger: '#portal',
            start: isPinned ? 'top top' : 'top 80%',
            end: isPinned ? '+=95%' : 'bottom 30%',
            pin: isPinned,
            scrub: 0.2,
            anticipatePin: 1,
            invalidateOnRefresh: true,
          }
        });

        apertureTl
          .fromTo(portalClip,
            { tb: 18, lr: 14, r: 48 },
            { tb: 0, lr: 0, r: 16, ease: 'power2.out', duration: 0.42, onUpdate: applyPortalClip },
            0
          )
          .fromTo(apertureMask,
            { scale: 0.94 },
            { scale: 1.0, ease: 'power2.out', duration: 0.42 },
            0
          )
          .to({}, { duration: 0.24 }, 0.42)
          .to(portalClip, {
            tb: 14,
            lr: 10,
            r: 44,
            ease: 'power2.inOut',
            duration: 0.34,
            onUpdate: applyPortalClip,
          }, 0.66)
          .to(apertureMask, {
            scale: 0.95,
            ease: 'power2.inOut',
            duration: 0.34,
          }, 0.66)
          .fromTo('#aperture-image',
            { yPercent: -15, scale: 1.22 },
            { yPercent: 15, scale: 1.04, ease: 'none', duration: 1 },
            0
          )
          .fromTo('#portal-hud-content',
            { opacity: 0.65, scale: 0.94 },
            { opacity: 1, scale: 1.0, ease: 'power2.out', duration: 0.42 },
            0
          )
          .to('#portal-hud-content', {
            opacity: 0.8,
            scale: 0.96,
            ease: 'power1.in',
            duration: 0.34,
          }, 0.66);

        return () => {
          portalClip.tb = 18;
          portalClip.lr = 14;
          portalClip.r = 48;
          applyPortalClip();
        };
      });

      // ========================================================
      // H. TOOLS & STACK 4-COLUMN CASCADE (UNIFIED NO-FLASH TIMING)
      // ========================================================
      const stackCards = gsap.utils.toArray('#stack .tilt-card');
      if (stackCards.length > 0) {
        revealGridCards(stackCards, { colsDesktop: 4, colsTablet: 2, y: 26, scale: 0.98, duration: 0.6 });

        gsap.from('#stack .grid .grid > span', {
          scrollTrigger: {
            trigger: '#stack .grid',
            start: 'top 90%',
            toggleActions: 'play none none none',
            once: true,
          },
          opacity: 0,
          y: 6,
          duration: 0.4,
          delay: 0.1,
          stagger: 0.015,
          ease: 'power2.out',
          clearProps: 'opacity,transform',
        });
      }

      // ========================================================
      // I. MILESTONES TRACK SCRUBBING & CARD REVEAL
      // ========================================================
      const milestoneCards = gsap.utils.toArray('.milestone-card');
      if (milestoneCards.length > 0) {
        revealGridCards(milestoneCards, { colsDesktop: 2, colsTablet: 2, y: 24, scale: 0.985, duration: 0.6 });
      }

      const milestoneTrack = document.getElementById('milestone-progress-line');
      const milestoneRunner = document.getElementById('milestone-runner');
      if (milestoneTrack && milestoneRunner) {
        gsap.set(milestoneTrack, { height: '100%', scaleY: 0, transformOrigin: 'top center' });

        function syncMilestoneCards(p) {
          milestoneCards.forEach((card, idx) => {
            const threshold = (idx + 0.5) / (milestoneCards.length || 1);
            const isActive = p > 0.01 && p >= threshold - 0.25 && p <= threshold + 0.25;
            const activeClass = idx % 2 === 0 ? 'is-active-lime' : 'is-active-red';
            card.classList.toggle(activeClass, isActive);
          });
        }

        const milestoneTl = gsap.timeline({
          scrollTrigger: {
            trigger: '#milestones',
            start: 'top 65%',
            end: 'bottom 55%',
            scrub: 0.2,
            invalidateOnRefresh: true,
          },
          onUpdate: function () {
            syncMilestoneCards(this.progress());
          }
        });

        milestoneTl
          .fromTo(milestoneTrack,
            { scaleY: 0 },
            { scaleY: 1, ease: 'none', duration: 1 },
            0
          )
          .fromTo(milestoneRunner,
            { yPercent: -50, y: 0 },
            { yPercent: -50, y: () => (milestoneTrack.parentElement ? milestoneTrack.parentElement.clientHeight : 0), ease: 'none', duration: 1 },
            0
          );
      }

      // I2. EXPERIENCE CARDS REVEAL
      const experienceCards = gsap.utils.toArray('.experience-card');
      if (experienceCards.length > 0) {
        revealGridCards(experienceCards, { colsDesktop: 2, colsTablet: 2, y: 24, scale: 0.985, duration: 0.6 });
      }

      // ========================================================
      // J. CONTACT SECTION STAGE ZOOM & CASCADE
      // ========================================================
      gsap.fromTo('#cta-stage-bg',
        { scale: 1.12, opacity: 0.78 },
        {
          scale: 1.0,
          opacity: 0.95,
          ease: 'none',
          scrollTrigger: {
            trigger: '#terminal',
            start: 'top bottom',
            end: 'bottom bottom',
            scrub: 0.2,
          }
        }
      );

      gsap.from('#terminal .w-full.max-w-md, #terminal .mt-4', {
        scrollTrigger: {
          trigger: '#terminal',
          start: 'top 92%',
          toggleActions: 'play none none none',
          once: true,
        },
        opacity: 0,
        y: 24,
        duration: 0.6,
        stagger: 0.08,
        ease: 'power3.out',
        clearProps: 'opacity,transform',
      });

      // ========================================================
      // K. BIDIRECTIONAL NAVBAR ACTIVE SECTION SYNC
      // ========================================================
      ScrollTrigger.create({
        trigger: '#hero',
        start: 'top top',
        end: 'bottom 45%',
        onEnter: () => setActiveNavSection(null),
        onEnterBack: () => setActiveNavSection(null),
      });

      ['philosophy', 'design', 'academics', 'work', 'stack', 'milestones', 'experience', 'terminal'].forEach((id) => {
        const sectionEl = document.getElementById(id);
        if (!sectionEl) return;
        ScrollTrigger.create({
          trigger: sectionEl,
          start: 'top 45%',
          end: 'bottom 45%',
          onToggle: (self) => {
            if (self.isActive) setActiveNavSection(id);
          }
        });
      });

      ScrollTrigger.sort();
    }

    // Initialize when DOM is ready and refresh coordinates once fonts & images settle
    function handleReady() {
      initMasterMotion();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          if (typeof ScrollTrigger !== 'undefined') {
            ScrollTrigger.refresh();
          }
        });
      }
      window.addEventListener('load', () => {
        if (typeof ScrollTrigger !== 'undefined') {
          ScrollTrigger.refresh();
        }
      }, { once: true });
    }

    // Window resize handler with debounce for responsive ScrollTrigger recalibration
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (typeof ScrollTrigger !== 'undefined') {
          ScrollTrigger.refresh();
        }
      }, 200);
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', handleReady);
    } else {
      handleReady();
    }
  </script>
</body>
</html>
